# RAWCaptureBooth-Fernwartung: baut die beiden gebrandeten Windows-Clients
#   RAWCaptureBooth-Support.exe    Kunde, kostenloser Support (Diagnose, Fehlerbehebung), nur eingehend,
#                                  Quick Support ohne Installation
#   RAWCaptureBooth-Service.exe    Kunde, kostenpflichtige Hilfe, wie Support, aber Annahme nur per
#                                  Klick mit Kostenhinweis und AGB
#   RAWCaptureBooth-Techniker.exe  Support, nur ausgehend
#   RAWCaptureBooth-Fotobox.exe    eigene Fotoboxen, installierbar, Zugang nur über den
#                                  dauerhaften PIN, der nach der Installation an der Box gesetzt wird
#
# Abgeleitet vom Windows-x64-Teil aus flutter-build.yml (RustDesk 1.5.1).
# Signiert wird über Azure Artifact Signing (OIDC, kein Geheimnis im Repo), sobald die
# Repository-Variablen AZURE_CLIENT_ID, AZURE_TENANT_ID und AZURE_SUBSCRIPTION_ID gesetzt
# sind. Ohne sie entstehen unsignierte Probedateien.

name: Fernwartung bauen

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

env:
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  SIGNIEREN: ${{ vars.AZURE_CLIENT_ID != '' }}
  SIGNATUR_ENDPUNKT: "https://neu.codesigning.azure.net/"
  SIGNATUR_KONTO: "rawcapturebooth"
  SIGNATUR_PROFIL: "RAWCaptureBooth"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  bauen:
    name: ${{ matrix.variante.name }}
    needs: [generate-bridge]
    runs-on: windows-2022
    # Die Azure-Anmeldung vertraut nur dieser Umgebung; sie ist auf den Branch
    # rawcapturebooth und Tags v* beschränkt.
    environment: signatur
    strategy:
      fail-fast: false
      matrix:
        variante:
          - { id: kunde, name: RAWCaptureBooth-Support, quick-support: "1" }
          - { id: service, name: RAWCaptureBooth-Service, quick-support: "1" }
          - { id: techniker, name: RAWCaptureBooth-Techniker, quick-support: "" }
          - { id: fotobox, name: RAWCaptureBooth-Fotobox, quick-support: "" }
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Branding anwenden
        shell: bash
        run: |
          pip3 install pillow
          python3 branding/anwenden.py ${{ matrix.variante.id }}

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      # https://github.com/flutter/flutter/issues/155685
      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022-${{ matrix.variante.id }}

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"; echo "======"; cat "$_1"; echo "======"; echo ""
            done
            exit 1
          fi

      - name: Build rustdesk
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk

      - name: find Runner.res
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res" | head -1)
          if [ -z "$runner_res" ]; then echo "Runner.res fehlt"; exit 1; fi
          cp "$runner_res" ./libs/portable/Runner.res

      - name: Azure-Anmeldung (OIDC)
        if: env.SIGNIEREN == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Programmdateien signieren
        if: env.SIGNIEREN == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ env.SIGNATUR_ENDPUNKT }}
          signing-account-name: ${{ env.SIGNATUR_KONTO }}
          certificate-profile-name: ${{ env.SIGNATUR_PROFIL }}
          files-folder: ${{ github.workspace }}\rustdesk
          files-folder-filter: exe,dll
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Treiber für virtuellen Bildschirm beilegen
        # Erst nach dem Signieren: der Treiber trägt die Signatur des Herstellers und
        # darf nicht mit unserer überschrieben werden.
        run: |
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

      - name: Einzeldatei packen
        shell: bash
        env:
          RCB_QUICK_SUPPORT: ${{ matrix.variante.quick-support }}
        run: |
          # option_env! wertet auch eine leere Variable als gesetzt, daher nur für den Kunden setzen
          if [ -z "$RCB_QUICK_SUPPORT" ]; then unset RCB_QUICK_SUPPORT; fi
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe
          popd
          mkdir -p ./Ausgabe
          mv ./target/release/rustdesk-portable-packer.exe ./Ausgabe/${{ matrix.variante.name }}.exe

      - name: Einzeldatei signieren
        if: env.SIGNIEREN == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ env.SIGNATUR_ENDPUNKT }}
          signing-account-name: ${{ env.SIGNATUR_KONTO }}
          certificate-profile-name: ${{ env.SIGNATUR_PROFIL }}
          files: ${{ github.workspace }}\Ausgabe\${{ matrix.variante.name }}.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: ${{ matrix.variante.name }}
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Signatur prüfen
        if: env.SIGNIEREN == 'true'
        shell: powershell
        run: |
          $sig = Get-AuthenticodeSignature -LiteralPath ".\Ausgabe\${{ matrix.variante.name }}.exe"
          if ($sig.Status -ne 'Valid') { throw "Signatur ungültig: $($sig.Status)" }
          Write-Host "Signiert von: $($sig.SignerCertificate.Subject)"

      - name: Hochladen
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.variante.name }}
          path: ./Ausgabe/${{ matrix.variante.name }}.exe
          if-no-files-found: error

      - name: Release anlegen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          files: ./Ausgabe/${{ matrix.variante.name }}.exe
